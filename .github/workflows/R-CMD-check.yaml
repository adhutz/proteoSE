# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# R CMD check for the proteoSE package.
#
# proteoSE depends on a large Bioconductor stack plus two GitHub-only packages
# (DEP2, uniprotREST, declared in DESCRIPTION `Remotes:`). pak resolves CRAN,
# Bioconductor and GitHub sources, so dependency install is handled by
# r-lib/actions/setup-r-dependencies. Because the dependency tree is heavy, the
# check runs on a single target (ubuntu-latest, R release) rather than a full
# OS matrix; expand `config` if broader coverage is wanted.
on:
  push:
    branches: [main, master, v0.2, v0.3]
  pull_request:
    branches: [main, master, v0.2, v0.3]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # Examples reach the network/real data and are wrapped in \dontrun,
          # so they stay off. Vignettes are built and run: they execute more of
          # the package than the test suite does, and every bug found in
          # session 6 was one only a vignette render reached.
          args: 'c("--no-manual", "--no-examples")'
          error-on: '"error"'
          upload-snapshots: true
